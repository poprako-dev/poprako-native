  "base64",
  "bitflags",
  "block-buffer",
  "cpufeatures",
  "crypto-common",
  "digest",
  "getrandom",
  "hashbrown",
  "heck",
  "indexmap",
  "jni-sys",
  "miniz_oxide",
  "png",
  "proc-macro-crate",
  "r-efi",
  "schemars",
  "serde_spanned",
  "sha2",
  "syn",
  "thiserror",
  "thiserror-impl",
  "toml_edit",
  "windows-core",
  "windows-link",
  "windows-result",
  "windows-strings",
  "windows-sys",
  "windows-targets",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc"
