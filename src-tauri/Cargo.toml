[workspace]
members = ["sql-prepare", "style-check"]
resolver = "3"

[package]
name = "poprako-native"
default-run = "poprako-native"
version = "1.0.0"
description = "Offline comic translation workspace"
authors = ["Lubover"]
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false
readme = "../README.md"
keywords = ["comic", "translation", "offline"]
categories = ["localization"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poprako_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["macos-private-api"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-dialog = "=2.7.3"
tauri-specta = { version = "=2.0.0-rc.24", features = ["typescript"] }
specta = { version = "=2.0.0-rc.24", features = ["derive", "uuid"] }
specta-typescript = "=0.0.11"
poprako-orchestra = { version = "=0.6.0", features = ["macro", "oper_ext"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "uuid"] }
tokio = { version = "=1.53.1", features = ["sync", "rt-multi-thread", "macros", "time"] }
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
unicode-normalization = "=0.1.25"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSString"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Boolean matches preserve the project's explicit prohibition on ordinary else branches.
match_bool = "allow"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS 27 rejects misaligned proc-macro dylibs stripped by Rust 1.95.
[profile.release.build-override]
strip = "none"
