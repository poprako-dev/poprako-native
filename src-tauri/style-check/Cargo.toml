[package]
name = "poprako-style-check"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Lubover"]
license = "AGPL-3.0-or-later"
readme = "../../README.md"
description = "Rust source quality checks for PopRaKo Native"
keywords = ["lint", "rust", "quality"]
categories = ["development-tools"]

[dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
